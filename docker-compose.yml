version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acm_competition
      POSTGRES_USER: acm_user
      POSTGRES_PASSWORD: acm_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acm_user -d acm_competition']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: acm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://acm_user:acm_password@postgres:5432/acm_competition
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: http://localhost:5173
      OTP_DEV_MODE: 'false'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: acm_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api

volumes:
  postgres_data:
